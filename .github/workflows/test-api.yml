name: Testes API com Newman

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman e reporter HTML
        run: npm install -g newman newman-reporter-htmlextra

      - name: Rodar collection no Mock do Postman
        run: |
          cd Postman
          newman run "Teste API.postman_collection.json" \
            -e "Challenge Orders.postman_environment.json" \
            --env-var baseUrl="https://6781a5b5-18eb-4f89-af70-db6dcc8194b8.mock.pstmn.io" \
            --delay-request 3000 \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export ../report.html

      - name: Upload relatório Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
